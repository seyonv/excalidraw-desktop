<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3A67"/>
      <stop offset="1" stop-color="#1A2340"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2B66D"/>
      <stop offset="1" stop-color="#D98E3F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0B1020" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS squircle tile -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>

  <!-- back card, leaning left -->
  <g transform="rotate(-11 330 700)" filter="url(#soft)">
    <rect x="228" y="330" width="230" height="330" rx="22" fill="#E9EEF8"/>
    <path d="M268 420 q40 -34 80 0 t80 0" fill="none" stroke="#6C7CB4" stroke-width="13" stroke-linecap="round"/>
    <path d="M268 480 h120" fill="none" stroke="#6C7CB4" stroke-width="13" stroke-linecap="round"/>
    <path d="M268 530 h86" fill="none" stroke="#6C7CB4" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- middle card, upright: a little diagram -->
  <g filter="url(#soft)">
    <rect x="388" y="270" width="270" height="400" rx="24" fill="#FFF9EF"/>
    <path d="M428 330 l92 -3 l3 70 l-94 4 z" fill="#FFD9C9" stroke="#1E2747" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="585" cy="500" r="40" fill="#C9F0E4" stroke="#1E2747" stroke-width="12"/>
    <path d="M478 404 C 480 470, 500 500, 538 500" fill="none" stroke="#1E2747" stroke-width="12" stroke-linecap="round"/>
    <path d="M520 482 l20 18 l-22 16" fill="none" stroke="#1E2747" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M430 600 q30 -16 60 0 t60 0 t60 0" fill="none" stroke="#FF7A59" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- front card, leaning right -->
  <g transform="rotate(9 700 690)" filter="url(#soft)">
    <rect x="600" y="370" width="200" height="300" rx="22" fill="#FFE7A8"/>
    <path d="M640 430 l60 0" stroke="#1E2747" stroke-width="12" stroke-linecap="round"/>
    <path d="M640 474 l110 0" stroke="#1E2747" stroke-width="12" stroke-linecap="round"/>
    <path d="M640 518 l84 0" stroke="#1E2747" stroke-width="12" stroke-linecap="round"/>
    <path d="M642 590 l22 22 l46 -52" fill="none" stroke="#2EAD84" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the shelf -->
  <g filter="url(#soft)">
    <rect x="190" y="676" width="644" height="44" rx="14" fill="url(#shelf)"/>
    <rect x="236" y="720" width="34" height="62" rx="8" fill="#B8742F"/>
    <rect x="754" y="720" width="34" height="62" rx="8" fill="#B8742F"/>
  </g>
</svg>
